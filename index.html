<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1730">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Advent GymHIP">
  <meta name="description" content="Der digitale Adventskalender des Gymnasiums Hilpoltstein – jeden Tag im Dezember ein neues Türchen.">
  <title>Adventskalender · Gymnasium Hilpoltstein</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/dancing-script-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/cards.css">
  <link rel="stylesheet" href="assets/calendar.css">
</head>
<body>
  <!-- Eingangstür: öffnet sich bei jedem Aufruf -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__light"></div>
    <div class="intro__seam"></div>
    <div class="wing wing--l">
      <div class="wing__panel wing__panel--top"><div class="wing__wreath" data-seed="11"></div><span class="wing__num" data-year-part="0">20</span></div>
      <div class="wing__panel wing__panel--bottom"><span class="wing__label">Gymnasium</span></div>
      <span class="wing__handle"></span>
    </div>
    <div class="wing wing--r">
      <div class="wing__panel wing__panel--top"><div class="wing__wreath" data-seed="23"></div><span class="wing__num" data-year-part="1">26</span></div>
      <div class="wing__panel wing__panel--bottom"><span class="wing__label">Hilpoltstein</span></div>
      <span class="wing__handle"></span>
    </div>
  </div>

  <div class="sky" aria-hidden="true">
    <div class="sky__stars"></div>
    <svg class="sky__hills" viewBox="0 0 1440 220" preserveAspectRatio="none"><path d="M0 140 C 220 80 380 120 560 100 C 760 76 900 130 1080 110 C 1240 92 1360 112 1440 100 L1440 220 L0 220Z" fill="#0f2142"/><path d="M0 180 C 260 140 460 170 700 150 C 940 130 1160 175 1440 150 L1440 220 L0 220Z" fill="#0b1832"/></svg>
  </div>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <div class="preview-banner" id="preview-banner" hidden></div>

  <button class="music" id="music" type="button" aria-pressed="false" aria-label="Musik abspielen" hidden>
    <svg class="music__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg>
    <svg class="music__off" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="3.2" height="12" rx="1" fill="currentColor"/><rect x="13.8" y="6" width="3.2" height="12" rx="1" fill="currentColor"/></svg>
  </button>

  <main class="page" id="page">
    <header class="hero">
      <img class="hero__logo" src="assets/img/logo.png" alt="Logo des Gymnasiums Hilpoltstein" width="72" height="72">
      <p class="hero__kicker" id="subtitle">Gymnasium Hilpoltstein</p>
      <h1 class="hero__title"><span class="hero__script" id="title">Adventskalender</span> <span class="hero__year" id="year"></span></h1>
      <p class="hero__info" id="info">&nbsp;</p>
    </header>

    <section class="calendar" id="calendar" aria-label="Türchen"></section>

    <footer class="foot" id="foot"></footer>
  </main>

  <!-- Inhalt eines Türchens -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__grab" aria-hidden="true"></div>
      <header class="sheet__head">
        <p class="sheet__title" id="sheet-title"></p>
        <button class="sheet__close" type="button" data-close aria-label="Schließen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="sheet__body" id="sheet-body"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/calendar.js"></script>
</body>
</html>
